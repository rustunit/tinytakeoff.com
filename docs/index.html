<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyTakeoff</title>

    
    
    

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #353069;
            color: white;
        }

        p {
            text-align: center;
        }

        footer {
            text-align: center;
            margin-top: 20px;
        }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            margin: auto;
        }

        .banner {
            margin: 30px 0;
            width: 45%;
            max-width: 260px;
            display: block;
            /* 22.37% of the icon size is Apple's squircle approximation */
            border-radius: 22.37%;
            /* hairline rim + ambient shadow, as iOS renders app icons */
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.14),
                0 10px 24px rgba(0, 0, 0, 0.35),
                0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .download-btn {
            flex-grow: 1;
            /* width: 200px; */
            cursor: pointer;
        }

        .links {
            display: flex;
            gap: 20px;
            max-width: 600px;
        }

        .apple {
            width: 100%;
        }

        .google {
            width: 100%;
        }

        .ru-link {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
        }

        .ru-logo {
            top: 25px;
            left: 25px;
            position: fixed;
            width: 50px;
            filter: invert(100);
        }
    </style>

    <!-- Fathom - beautiful, simple website analytics -->
    <script src="https://cdn.usefathom.com/script.js" data-spa="auto" data-site="SIDIFPOR" defer></script>
    <!-- / Fathom -->
</head>

<body>
    <header>
        <a href="https://rustunit.com"><img src="assets/logo.svg" class="ru-logo" /></a>
    </header>
    <div class="main">
        <img src="assets/Website-Icon.png" alt="Game Banner" class="banner">

        <p>
            Unlock Various Fluffy Flying Animal Superheroes and steer them through fantastic worlds. Compete against
            sheep around the world and be the best in this unique challenge!
        </p>

        <!-- <a href="https://apps.apple.com/app/id6503081219" class="download-btn">
            <img src="assets/Apple-Download.svg" alt="iOS download" class="apple" />
        </a> -->

        <div class="links">
            <!-- <a href="https://play.google.com/store/apps/details?id=com.rustunit.tinytakeoff" class="download-btn">
                <img src="assets/google-play.svg" alt="google play" class="google" />
            </a> -->
            <a href="https://testflight.apple.com/join/eYDgYtxA" class="download-btn">
                <img src="assets/Testflight.svg" alt="iOS testflight" class="apple" />
            </a>
            <a href="https://web.tinytakeoff.com" class="download-btn">
                <img src="assets/Web.svg" alt="play web" class="apple" />
            </a>
        </div>
    </div>
    <footer>
        <a href="https://rustunit.com" class="ru-link">Powered by 2024 Rustunit B.V.</a>
    </footer>
<script>"use strict";

(function () {

    const address = '{{__TRUNK_ADDRESS__}}';
    const base = '{{__TRUNK_WS_BASE__}}';
    let protocol = '';
    protocol =
        protocol
            ? protocol
            : window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
    const url = protocol + '://' + address + base + '.well-known/trunk/ws';

    class Overlay {
        constructor() {
            // create an overlay
            this._overlay = document.createElement("div");
            const style = this._overlay.style;
            style.height = "100vh";
            style.width = "100vw";
            style.position = "fixed";
            style.top = "0";
            style.left = "0";
            style.backgroundColor = "rgba(222, 222, 222, 0.5)";
            style.fontFamily = "sans-serif";
            // not sure that's the right approach
            style.zIndex = "1000000";
            style.backdropFilter = "blur(1rem)";

            const container = document.createElement("div");
            // center it
            container.style.position = "absolute";
            container.style.top = "30%";
            container.style.left = "15%";
            container.style.maxWidth = "85%";

            this._title = document.createElement("div");
            this._title.innerText = "Build failure";
            this._title.style.paddingBottom = "2rem";
            this._title.style.fontSize = "2.5rem";

            this._message = document.createElement("div");
            this._message.style.whiteSpace = "pre-wrap";

            const icon= document.createElement("div");
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';
            this._title.prepend(icon);

            container.append(this._title, this._message);
            this._overlay.append(container);

            this._inject();
            window.setInterval(() => {
                this._inject();
            }, 250);
        }

        set reason(reason) {
            this._message.textContent = reason;
        }

        _inject() {
            if (!this._overlay.isConnected) {
                // prepend it
                document.body?.prepend(this._overlay);
            }
        }

    }

    class Client {
        constructor(url) {
            this.url = url;
            this.poll_interval = 5000;
            this._overlay = null;
        }

        start() {
            const ws = new WebSocket(this.url);
            ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                switch (msg.type) {
                    case "reload":
                        this.reload();
                        break;
                    case "buildFailure":
                        this.buildFailure(msg.data)
                        break;
                }
            };
            ws.onclose = () => this.onclose();
        }

        onclose() {
            window.setTimeout(
                () => {
                    // when we successfully reconnect, we'll force a
                    // reload (since we presumably lost connection to
                    // trunk due to it being killed, so it will have
                    // rebuilt on restart)
                    const ws = new WebSocket(this.url);
                    ws.onopen = () => window.location.reload();
                    ws.onclose = () => this.onclose();
                },
                this.poll_interval);
        }

        reload() {
            window.location.reload();
        }

        buildFailure({reason}) {
            // also log the console
            console.error("Build failed:", reason);

            console.debug("Overlay", this._overlay);

            if (!this._overlay) {
                this._overlay = new Overlay();
            }
            this._overlay.reason = reason;
        }
    }

    new Client(url).start();

})()
</script></body>

</html>
